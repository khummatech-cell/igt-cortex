<!DOCTYPE html>
<html lang="en">
<head>
    <title>IGT GOD MODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans p-8">
    
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-red-500"><i class="fas fa-shield-alt"></i> IGT SUPER ADMIN</h1>
        <div class="text-sm text-gray-400">Security Clearance: <span class="text-white font-bold">LEVEL 5</span></div>
    </div>

    <!-- STATS -->
    <div class="grid grid-cols-4 gap-6 mb-8">
        <div class="bg-slate-800 p-6 rounded border-l-4 border-blue-500">
            <h3 class="text-gray-400">Total Subscribers</h3>
            <div class="text-3xl font-bold" id="total-orgs">0</div>
        </div>
        <div class="bg-slate-800 p-6 rounded border-l-4 border-green-500">
            <h3 class="text-gray-400">Active Chats</h3>
            <div class="text-3xl font-bold" id="total-chats">0</div>
        </div>
        <div class="bg-slate-800 p-6 rounded border-l-4 border-purple-500">
            <h3 class="text-gray-400">Total Users</h3>
            <div class="text-3xl font-bold" id="total-users">0</div>
        </div>
        <div class="bg-slate-800 p-6 rounded border-l-4 border-red-500">
            <h3 class="text-gray-400">Policy Violations</h3>
            <div class="text-3xl font-bold">0</div>
        </div>
    </div>

    <div class="grid grid-cols-3 gap-8">
        <!-- SUBSCRIBER MANAGEMENT -->
        <div class="col-span-2 bg-slate-800 p-6 rounded">
            <h2 class="text-xl font-bold mb-4">Subscriber Oversight</h2>
            <table class="w-full text-left text-sm text-gray-400">
                <thead class="bg-slate-700 text-white">
                    <tr>
                        <th class="p-3">Org ID</th>
                        <th class="p-3">Company Name</th>
                        <th class="p-3">Status</th>
                        <th class="p-3">Actions</th>
                    </tr>
                </thead>
                <tbody id="org-list"></tbody>
            </table>
        </div>

        <!-- PACKET TRACE / LOGS -->
        <div class="bg-black p-4 rounded font-mono text-xs text-green-400 h-96 overflow-y-auto border border-gray-700">
            <div class="font-bold text-white mb-2 border-b border-gray-700 pb-2">Packet Trace / Activity Log</div>
            <div id="packet-trace" class="space-y-1"></div>
        </div>
    </div>

    <script>
        async function loadAdmin() {
            const res = await fetch('/api/admin/stats');
            const data = await res.json();

            document.getElementById('total-orgs').innerText = data.total_orgs;
            document.getElementById('total-users').innerText = data.total_users;
            document.getElementById('total-chats').innerText = data.total_chats;

            const list = document.getElementById('org-list');
            list.innerHTML = '';
            data.orgs.forEach(o => {
                const statusColor = o.status === 'active' ? 'text-green-500' : 'text-red-500';
                list.innerHTML += `
                    <tr class="border-b border-gray-700">
                        <td class="p-3">${o.id}</td>
                        <td class="p-3 font-bold text-white">${o.name}</td>
                        <td class="p-3 ${statusColor}">${o.status.toUpperCase()}</td>
                        <td class="p-3 flex gap-2">
                            <button onclick="modOrg('${o.id}', 'suspend')" class="bg-yellow-600 text-white px-2 py-1 rounded hover:bg-yellow-700" title="Suspend"><i class="fas fa-pause"></i></button>
                            <button onclick="modOrg('${o.id}', 'block')" class="bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700" title="Block Perm"><i class="fas fa-ban"></i></button>
                            <button onclick="modOrg('${o.id}', 'recover')" class="bg-green-600 text-white px-2 py-1 rounded hover:bg-green-700" title="Recover"><i class="fas fa-undo"></i></button>
                        </td>
                    </tr>
                `;
            });

            const logs = document.getElementById('packet-trace');
            logs.innerHTML = '';
            data.logs.forEach(l => {
                logs.innerHTML += `<div><span class="text-gray-500">[${new Date(l.time).toLocaleTimeString()}]</span> <span class="text-blue-400">${l.type}</span>: ${l.desc}</div>`;
            });
        }

        async function modOrg(id, action) {
            if(!confirm(`Are you sure you want to ${action} this organization?`)) return;
            await fetch('/api/admin/action', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ orgID: id, action })
            });
            loadAdmin();
        }

        loadAdmin();
        setInterval(loadAdmin, 3000);
    </script>
</body>
</html>
